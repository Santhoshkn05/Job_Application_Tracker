<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="register.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
    <header>
        <div class="theme-toggle">
                <a href="#" id="themeBtn"><i class="bi bi-moon-fill"></i></a>
        </div>
    </header>

    <section class="register-container">
        <div class="register-card">
            <h2>CREATE ACCOUNT</h2>
        <form class="register-form">
            <label for="name">Name</label>
            <input type="text" id="name" placeholder="enter your name" required>
            <label for="email">Email Id</label>
            <input type="email" id="email" placeholder="enter your email id" required>
            <label for="password">Password</label>
            <!-- <input type="password" id="psw" name="psw" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" title="Must contain at least one number and one uppercase and lowercase letter, and at least 8 or more characters" placeholder="create password"> -->
            <input type="password" id="password" placeholder="create password" required>
            <label for="confirm password">Confirm password</label>
            <input type="password" id="confirmPassword" placeholder="confirm password" required>
            <button type="submit" class="register-btn">Register</button>

            <div class="login-redirect">
                <p>Already have an account? <a href="login.html">Login here</a></p>
            </div>
        </form>
        </div>
    </section>
    <script src="theme.js"></script>
    <script src="register.js"></script>
</body>
</html>
